[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-core"
version = "0.1.0"
description = "Local-first company memory, translation, change intelligence, and approval engine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["cryptography>=46.0.7,<47"]

[project.scripts]
atlas-core = "atlas_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
